name: 🚀 Deploy — maccatoanthang.com

# ──────────────────────────────────────────────────────────────
#  Trigger: push lên nhánh main HOẶC trigger thủ công
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do deploy thủ công'
        required: false
        default: 'Manual deploy'

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME = ghcr.io/<github_username>/<repo_name>
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# ══════════════════════════════════════════════════════════════
#  JOB 1: BUILD & PUSH DOCKER IMAGE
# ══════════════════════════════════════════════════════════════
jobs:
  build:
    name: 🔨 Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Cho phép push lên GitHub Container Registry

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      # 1. Checkout source code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Cài JDK 21 (cache Gradle dependencies)
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Cấp quyền thực thi gradlew
      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 4. Chạy unit test — nếu fail, dừng toàn bộ pipeline
      - name: 🧪 Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      # 5. Đăng nhập vào GitHub Container Registry
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Tạo metadata (tags, labels) cho Docker image
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 7. Build Docker image và push lên ghcr.io
      #    (cache layer để lần sau build nhanh hơn)
      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ══════════════════════════════════════════════════════════════
#  JOB 2: DEPLOY LÊN SERVER
#  Chỉ chạy sau khi JOB 1 thành công
# ══════════════════════════════════════════════════════════════
  deploy:
    name: 🌐 Deploy to maccatoanthang.com
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1. Checkout để lấy file cần sync lên server
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Sync thư mục frontend lên server
      - name: 📂 Sync frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/"
          target: "/opt/maccatoanthang/"

      # 3. Sync nginx config lên server
      - name: 📂 Sync nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/"
          target: "/opt/maccatoanthang/"

      # 4. Sync docker-compose.yml lên server
      - name: 📂 Sync docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/maccatoanthang/"

      # 5. SSH vào server và deploy
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e   # Dừng ngay nếu có lỗi

            cd /opt/maccatoanthang

            # Đăng nhập GitHub Container Registry trên server
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export biến cho docker-compose (chuyển chữ thường vì Docker yêu cầu lowercase)
            export GITHUB_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Pull image mới nhất từ ghcr.io
            docker compose pull backend

            # Khởi động / cập nhật các service (db, backend, nginx)
            docker compose up -d --remove-orphans

            # Reload nginx config
            docker compose exec -T nginx nginx -s reload || true

            # Dọn dẹp image cũ (giải phóng ổ đĩa)
            docker image prune -f

            echo ""
            echo "✅ Deploy thành công lúc $(date '+%H:%M:%S %d/%m/%Y')"
            echo "📦 Image: ghcr.io/${{ github.repository }}:latest"
            echo "🌐 URL: https://maccatoanthang.com"

      # 6. Health check — Gọi API để xác nhận hệ thống hoạt động
      - name: 🏥 Health check
        run: |
          echo "Kiểm tra hệ thống hoạt động (tối đa 60 giây)..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              https://maccatoanthang.com/api/products?limit=1 \
              || echo "000")

            echo "Lần kiểm tra $i: HTTP Status $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check PASSED — hệ thống hoạt động hoàn hảo!"
              exit 0
            fi
            sleep 5
          done

          echo "❌ Health check FAILED — kiểm tra logs trên server"
          echo "Lệnh xem logs: docker compose logs --tail=50 backend"
          exit 1
