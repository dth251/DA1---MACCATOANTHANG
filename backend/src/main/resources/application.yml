server:
  port: ${PORT:8080}

spring:
  application:
    name: macca-toan-thang-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/macca_toanthang}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50
  jackson:
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  seed:
    enabled: ${SEED_ENABLED:true}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@ToanThang2026!}
  jwt:
    secret: ${JWT_SECRET:c4d9f6a1e8b2c7d3f5a0e9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8}
    expiration-hours: 8
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  cors:
    allowed-origins: ${PUBLIC_ORIGIN:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}
