version: '3.8'

# ============================================================
#  Macca Toàn Thắng — Production Docker Compose
#  Domain: maccatoanthang.com
#  Biến môi trường đọc từ file .env (cùng thư mục)
# ============================================================

services:

  # ──────────────────────────────────────────
  # 1. PostgreSQL Database
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: macca_db
    restart: always
    environment:
      POSTGRES_DB: macca_toanthang
      POSTGRES_USER: macca_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - macca_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macca_user -d macca_toanthang"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────
  # 2. Spring Boot Backend
  # ──────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: macca_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/macca_toanthang
      DB_USERNAME: macca_user
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    expose:
      - "8080"
    networks:
      - macca_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/products?limit=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────────────────────
  # 3. Nginx — Web Server + Reverse Proxy
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: macca_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - macca_net

# ──────────────────────────────────────────
# Volumes & Networks
# ──────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  macca_net:
    driver: bridge
