# ============================================================
#  Nginx Configuration — maccatoanthang.com
#  - HTTP  (:80)  → redirect sang HTTPS
#  - HTTPS (:443) → serve frontend + proxy /api/ → backend
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;   # Ẩn phiên bản Nginx

    # ── Gzip Compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml application/xml;

    # ── Rate Limiting (chống spam API) ──────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # ── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ============================================================
    # SERVER 1: HTTP :80 — Redirect sang HTTPS
    # ============================================================
    server {
        listen 80;
        server_name maccatoanthang.com www.maccatoanthang.com;

        # Redirect tất cả sang HTTPS (301 permanent)
        return 301 https://maccatoanthang.com$request_uri;
    }

    # ============================================================
    # SERVER 2: HTTPS :443 — Server chính
    # ============================================================
    server {
        listen 443 ssl;
        http2  on;
        server_name maccatoanthang.com www.maccatoanthang.com;

        # ── SSL Certificate (do Certbot tạo) ────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Security Headers ────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            "SAMEORIGIN"                         always;
        add_header X-Content-Type-Options     "nosniff"                            always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"    always;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Cache file tĩnh 30 ngày ─────────────────────────
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Backend API Reverse Proxy (/api/ → Spring Boot) ─
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Không cache API response
            add_header Cache-Control "no-store, no-cache";
        }

        # ── Frontend — không cache file HTML để luôn cập nhật tức thì ───
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options            "SAMEORIGIN"                         always;
            add_header X-Content-Type-Options     "nosniff"                            always;
            add_header Referrer-Policy            "strict-origin-when-cross-origin"    always;
            try_files $uri =404;
        }

        # ── Frontend — phục vụ file tĩnh và SPA fallback ────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Chặn truy cập file nhạy cảm ─────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
